[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-foundation-adapt"
version = "0.2.0"
description = "Label-efficiency comparison of linear probe, LoRA, and full finetune on EuroSAT RGB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.scripts]
geo-foundation-adapt = "geo_foundation_adapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geo_foundation_adapt = ["splits/*.txt"]
